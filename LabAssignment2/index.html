<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Form Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="table-section">
            <h2>List of Persons</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Age</th>
                        <th>City</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="personTable">
                </tbody>
            </table>
        </div>

        <div class="form-section">
            <h2>Add / Update Person Form</h2>

            <form id="personForm">

                <div class="form-row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" value="Tehreem">
                </div>

                <div class="form-row">
                    <label>Gender:</label>

                    <div class="gender-options">
                        <input type="radio" name="gender" id="male" value="Male">
                        <label for="male">Male</label>

                        <input type="radio" name="gender" id="female"
                               value="Female" checked>
                        <label for="female">Female</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="age">Age:</label>
                    <input type="number" id="age" value="31">
                </div>

                <div class="form-row">
                    <label for="city">City:</label>
                    <select id="city">
                        <option value="Lahore" selected>Lahore</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Multan">Multan</option>
                        <option value="Peshawar">Peshawar</option>
                    </select>
                </div>

                <div class="buttons">
                    <button type="button" id="reset">reset</button>
                    <button type="button" id="add">add</button>
                    <button type="button" id="update" disabled>update</button>
                </div>

                <p id="message"></p>

            </form>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

    
</body>
</html>
