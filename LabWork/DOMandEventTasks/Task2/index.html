<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2>

    <label>First Number</label>
    <input type="text" id="number1" placeholder="Enter First number">

    <br>
    <br>

    <label>Second Number</label>
    <input type="text" id="number2" placeholder="Enter Second number">

    <h3>Select Operation</h3>
    <label>Addition</label>
    <input type="radio" name="operation" value="add">
    <br>
    
    <label>Subtraction</label>
    <input type="radio" name="operation" value="subtract">
    <br>

    <label>Multiplication</label>
    <input type="radio"  name="operation" value="multiply">
    <br>

    <label>Division</label>
    <input type="radio" name="operation" value="divide">
    <br>
    <br>

    <button id="Calculate">Calculate</button>
    <br>
    <br>

    <div id="result">Result: </div>

    <script src="script.js"></script>
</body>
</html>
