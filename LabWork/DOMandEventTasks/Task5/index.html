<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change CSS Properties</title>
</head>
<body>
    <h2>Change Paraghraph Style</h2>
    <p id="paragraph">This is the sample paragraph. You can its style using CSS properties.</p>
    
    <label>CSS Property:</label>
    <input type="text" id="property" placeholder="e.g, color">
    <br><br>
    <label>CSS Value:</label>
    <input type="text" id="value" placeholder="e.g, blue">
    <br><br>
    <button id="apply">Apply</button>

    <p id="message"></p>
    <script src="script.js"></script>
</body>
</html>
