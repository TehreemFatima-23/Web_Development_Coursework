<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Styles3.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h1>University Student Dashboard</h1>
        </header>

        <aside class="sidebar">
            <h3>Navigation</h3>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">Home</a>
                <a href="#" class="nav-item">Students</a>
                <a href="#" class="nav-item">Courses</a>
                <a href="#" class="nav-item">Settings</a>
                <a href="#" class="nav-item">Profile</a>
                <a href="#" class="nav-item">Fees</a>
            </nav>
        </aside>

        <main class="main">
            <h2>Dashboard</h2>

            <div class="stats">
                <div class="card" tabindex="0">
                    <p>Class</p>
                    <h3>SP25-BSE-A</h3>
                </div>

                <div class="card" tabindex="0">
                    <p>Courses</p>
                    <strong>7</strong>
                </div>

                <div class="card" tabindex="0">
                    <p>Attendence</p>
                    <strong>97%</strong>
                </div>

                <div class="card" tabindex="0">
                    <p>Teachers</p>
                    <strong>11</strong>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Student Dashboard</p>
        </footer>

    </div>

</body>
</html>
