<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refactored Product Page</title>
    <link rel="stylesheet" href="Styles5.css">
</head>
<body>

    <nav>
        <h2>My Store</h2>

        <div>
            <a href="#">About Us</a>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="products">

        <div class="card">
            <img src="https://i.pinimg.com/474x/37/af/07/37af0765eeb3d0dde512ea8fd49807d1.jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p>A useful laptop for students and everyday work.</p>
            <p class="price">$700</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNp1T-aORS4BosvLk6cmvwar6iu2uEgmeKeb4AsRkznA&s=10" alt="Phone">
            <h2>Phone</h2>
            <p>A modern smartphone with useful features.</p>
            <p class="price">$400</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://arysahulatbazar.pk/wp-content/uploads/2026/06/buy-p9-wireless-headphones.jpg" alt="Headphones">
            <h2>Headphones</h2>
            <p>Comfortable headphones with good sound quality.</p>
            <p class="price">$80</p>
            <button>Add to Cart</button>
        </div>

    </section>

</body>
</html>
