
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Responsive Navbar</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <!-- Responsive navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Website brand -->
            <a class="navbar-brand" href="#">OnlineStore</a>

            <!-- Mobile menu button -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu"
                    aria-controls="mainMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Navigation links -->
            <div class="collapse navbar-collapse" id="mainMenu">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#products">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#help">Help</a>
                    </li>

                </ul>

                <!-- Call-to-action button -->
                <a class="btn btn-warning" href="#products">
                    Shop Now
                </a>

            </div>

        </div>

    </nav>

    <!-- Page content -->
    <main class="container py-5" id="products">

        <h1>Welcome to OnlineStore</h1>
        <p>Explore our products and find something you love.</p>

        <button class="btn btn-primary">
            Explore Products
        </button>

        <section class="mt-5" id="about">
            <h2>About Us</h2>
            <p>We provide quality products for our customers. Our team is dedicated to 
                offering fast shipping and 24/7 customer support worldwide.</p>
        </section>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
