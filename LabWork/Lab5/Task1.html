
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container py-4">

        <h1 class="text-center mb-4">
            Responsive Multi-Column Layout
        </h1>

        <!-- Bootstrap grid requires a row -->
        <div class="row g-3">

            <!-- One column on mobile, two on tablet, three on desktop -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-primary text-white p-4 rounded">
                    <h3>Card 1</h3>
                    <p>First Responsive Card.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-success text-white p-4 rounded">
                    <h3>Card 2</h3>
                    <p>Second Responsive Card.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-danger text-white p-4 rounded">
                    <h3>Card 3</h3>
                    <p>Third Responsive Card.</p>
                </div>
            </div>

        </div>

        <!-- Bootstrap handles the responsive layout with utility classes,
             so no custom CSS is needed for the grid. -->

    </div>

</body>
</html>
