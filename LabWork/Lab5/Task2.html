
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Filter Drawer</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">

        <h1 class="mb-4">Online Store</h1>

        <!-- This button is visible only on smaller screens -->
        <button class="btn btn-primary mb-3 d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#filterPanel"
                aria-expanded="false"
                aria-controls="filterPanel">
            Filters
        </button>

        <div class="row g-4">

            <!-- Filter sidebar -->
            <aside class="col-12 col-lg-3">

                <!-- Hidden on small screens; always visible on large screens -->
                <div class="collapse d-lg-block" id="filterPanel">

                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Filter Products</h5>

                            <p class="fw-bold">Category</p>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox" id="electronics">
                                <label class="form-check-label"
                                       for="electronics">
                                    Electronics
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox" id="clothing">
                                <label class="form-check-label"
                                       for="clothing">
                                    Clothing
                                </label>
                            </div>

                            <hr>

                            <p class="fw-bold">Price</p>
                            <p>Under Rs. 4,000</p>
                            <p>Rs. 4,000 - Rs. 10,000</p>

                        </div>
                    </div>

                </div>
            </aside>

            <!-- Product area -->
            <main class="col-12 col-lg-9">

                <div class="row g-3">

                    <!-- First Product: Light Primary Blue -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100 bg-primary-subtle border-primary">
                            <div class="card-body">
                                <h5 class="card-title">Headphones</h5>
                                <p class="card-text">Rs. 6,500</p>
                                <button class="btn btn-success">Add to Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Second Product: Light Info Cyan -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100 bg-info-subtle border-info">
                            <div class="card-body">
                                <h5 class="card-title">Smart Watch</h5>
                                <p class="card-text">Rs. 8,999</p>
                                <button class="btn btn-success">Add to Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Third Product: Light Warning Yellow -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100 bg-warning-subtle border-warning">
                            <div class="card-body">
                                <h5 class="card-title">Keyboard</h5>
                                <p class="card-text">Rs. 4,000</p>
                                <button class="btn btn-success">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                </div>

            </main>

        </div>

    </div>

    <!-- Bootstrap JavaScript enables the collapse button -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
