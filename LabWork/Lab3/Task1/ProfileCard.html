<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Profile Card</title>

<!-- External CSS -->
<link rel="stylesheet" href="Style1.css">

</head>
<body>

<div class="profile-card">

    <!-- Profile Photo -->
    <div class="avatar-container">
        <img src="Profile.jpg"
             alt="Profile Photo"
             class="profile-image">
    </div>

    <!-- Profile Information -->
    <div class="profile-content">

        <h1 class="profile-name">
            Tehreem Fatima
        </h1>

        <p class="profile-role">
            Software Engineering Student
        </p>

        <p class="profile-bio">
            I am a Software Engineering student interested in
            programming, web development, and learning new
            technologies.
        </p>

        <!-- Statistics -->
        <div class="statistics">

            <div class="stat">
                <strong>9</strong>
                <span>Projects</span>
            </div>

            <div class="stat">
                <strong>6</strong>
                <span>Courses</span>
            </div>

            <div class="stat">
                <strong>7</strong>
                <span>Skills</span>
            </div>

        </div>

        <!-- Contact Information -->
        <div class="contact-info">
            <p>Email: abcde@gmail.com</p>
            <p>Phone: 0300-9999999</p>
        </div>

        <!-- Primary Action Button -->
        <button class="action-btn">
            Contact Me
        </button>
    </div>

</div>
</body>
</html>
