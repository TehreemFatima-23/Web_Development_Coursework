<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-commerce Product Card</title>

<!-- External CSS -->
<link rel="stylesheet" href="Style3.css">

</head>

<body>

<div class="product-card">

    <!-- Product Image Container -->
    <div class="image-container">

        <!-- Sale Badge -->
        <span class="sale-badge">
            SALE
        </span>

        <!-- Product Image -->
        <img src="PowerBankPic.png"
             alt="Power Bank"
             class="product-image">

    </div>

    <!-- Product Information -->
    <div class="product-info">

        <!-- Category -->
        <p class="product-category">
            Electronics
        </p>

        <!-- Product Name -->
        <h1 class="product-name">
            Power Bank
        </h1>

        <!-- Description -->
        <p class="product-description">
            Never run out of battery again with this sleek,
            pocket sized portable power bank.
            Engineered for life on the go, it delivers ultra
            fast charging to keep your smartphones, tablets,
            and wireless earbuds powered up anywhere, anytime.
        </p>

        <!-- Prices -->
        <div class="price-container">

            <span class="current-price">
                $39.99
            </span>

            <span class="original-price">
                $68.99
            </span>

        </div>

        <!-- Stock Status -->
        <p class="stock-status">
            > In Stock
        </p>

        <!-- Buttons -->
        <div class="button-container">

            <button class="cart-btn">
                Add to Cart
            </button>

            <button class="wishlist-btn">
                Wishlist
            </button>

        </div>

    </div>

</div>

</body>
</html>
